plugins {
    id 'java-library'
    id 'jacoco'
    id 'maven-publish'
    id 'io.freefair.lombok' version '9.8.3'
}

repositories {
    mavenCentral()
}

java {
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

configurations {
    mockitoAgent
}

def mockito = 'org.mockito:mockito-core:5.24.0'

dependencies {
    implementation 'com.google.code.gson:gson:2.15.0'
    implementation 'org.slf4j:slf4j-api:2.0.20'

    testImplementation 'ch.qos.logback:logback-classic:1.6.6'
    testImplementation 'org.testng:testng:7.12.0'
    testImplementation 'org.hamcrest:hamcrest:3.0'
    testImplementation mockito
    mockitoAgent(mockito) {
        transitive = false
    }
    testImplementation 'com.squareup.okhttp3:mockwebserver3:5.5.1'
    testImplementation 'uk.org.webcompere:system-stubs-testng:2.1.8'
}

test {
    useTestNG()
    def agent = configurations.mockitoAgent
    jvmArgumentProviders.add({ ["-javaagent:${agent.singleFile}".toString()] } as CommandLineArgumentProvider)
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    reports {
        xml.required = true
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            pom {
                name = 'Visual Regression Tracker Java SDK'
                url = 'https://github.com/Visual-Regression-Tracker/sdk-java'
                licenses {
                    license {
                        name = 'Apache-2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0'
                    }
                }
            }
        }
    }
}
