group 'io.visual-regression-tracker.sdk-java'
version '4.3.1'

apply plugin: 'java'
apply plugin: 'jacoco'
apply plugin: "io.freefair.lombok"

repositories {
    mavenCentral()
}

buildscript {
    repositories {
        maven {
            url "https://plugins.gradle.org/m2/"
        }

    }
    dependencies {
        classpath "io.freefair.gradle:lombok-plugin:5.1.1"
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'org.slf4j:slf4j-api:2.0.20'
    testImplementation group: 'ch.qos.logback', name: 'logback-classic', version: '1.5.38'
    testImplementation group: 'org.testng', name: 'testng', version: '7.7.0'
    testImplementation 'commons-io:commons-io:2.18.0'
    testImplementation 'org.mockito:mockito-core:4.4.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'uk.org.webcompere:system-stubs-testng:2.1.3'
}

test {
    useTestNG()
}

// codecov integration https://github.com/codecov/example-gradle
jacocoTestReport {
    reports {
        xml.enabled true
        html.enabled true
    }
}

check.dependsOn jacocoTestReport

// Gradle 6.1 otherwise picks the sources variant of Kotlin multiplatform modules such as okio 3.6
configurations.matching { it.canBeResolved }.configureEach {
    attributes.attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
}
