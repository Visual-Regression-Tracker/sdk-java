name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # 27 is the newest non-LTS JDK: a forward-compatibility check that does not block merging
    continue-on-error: ${{ matrix.java == 27 }}
    strategy:
      fail-fast: false
      matrix:
        java: [ 25, 27 ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: ./gradlew build
      - if: matrix.java == 25
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: build/reports/jacoco/test/jacocoTestReport.xml
      - if: matrix.java == 25
        name: Build as JitPack does for a tag
        run: ./gradlew clean -Pgroup=com.github.Visual-Regression-Tracker -Pversion=ci -xtest assemble publishToMavenLocal

  # the required check on master: one name for the whole matrix
  build:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success
